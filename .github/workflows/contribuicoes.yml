name: Gráfico de contribuições

on:
  schedule:
    - cron: "17 3 * * *"   # todos os dias às 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar o SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/contrib.py
      - name: Guardar se mudou
        run: |
          git config user.name "Worevi"
          git config user.email "360714560+Worevi@users.noreply.github.com"
          git add assets/contribuicoes.svg
          git diff --cached --quiet && echo "sem alterações" || git commit -m "Atualizar gráfico de contribuições" && git push
